# ==============================================================================
# Barangay 183 WFP System - Zero-config Docker Compose (Coolify ready)
# ------------------------------------------------------------------------------
# No .env file is required. Everything below has working defaults:
#   - MySQL is bundled; Coolify auto-generates its user/passwords (SERVICE_*).
#   - APP_KEY is generated on first boot and persisted in the storage volume.
#   - System accounts are seeded on first boot; their generated passwords are
#     printed in the app logs and saved to storage/app/.initial_credentials.
# Any value can still be overridden from Coolify's Environment Variables tab.
# ==============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: "${APP_NAME:-Barangay 183 WFP System}"
        VITE_APP_BARANGAY_NAME: "${VITE_APP_BARANGAY_NAME:-Barangay 183}"
        VITE_APP_CITY_NAME: "${VITE_APP_CITY_NAME:-Villamor, Pasay City}"
        VITE_APP_ZONE: "${VITE_APP_ZONE:-Zone 20}"
        VITE_HOTLINE_BRGY: "${VITE_HOTLINE_BRGY:-0952-235-6413}"
        VITE_HOTLINE_VAWC: "${VITE_HOTLINE_VAWC:-0910-059-5240}"
        VITE_OFFICIAL_EMAIL: "${VITE_OFFICIAL_EMAIL:-support@brgy183villamor.gov.ph}"
        VITE_OFFICIAL_FB: "${VITE_OFFICIAL_FB:-https://www.facebook.com/profile.php?id=100084864033324}"
        VITE_BARANGAY_ADDRESS: "${VITE_BARANGAY_ADDRESS:-Zone 20 District 1 Pasay City, Metro Manila}"
        VITE_BARANGAY_LANDLINE: "${VITE_BARANGAY_LANDLINE:-Telephone No. (02) 853-0907 / (02) 835-1953}"
    image: women-and-family-app:latest
    restart: unless-stopped
    ports:
      - "9800:9800"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 9800
      APP_NAME: "${APP_NAME:-Barangay 183 WFP System}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:9800}"
      APP_KEY: "${APP_KEY:-}"
      APP_TIMEZONE: Asia/Manila
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wfp_system
      DB_USERNAME: "${SERVICE_USER_MYSQL}"
      DB_PASSWORD: "${SERVICE_PASSWORD_MYSQL}"
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      BROADCAST_CONNECTION: log
      AUTORUN_MIGRATIONS: "true"
      AUTORUN_SEED: "true"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-Dus Empleo}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-djkhalid1m@gmail.com}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-Dustin_183@Women&Family2026}"
      SEED_HEAD_NAME: "${SEED_HEAD_NAME:-Gerald Sobrevega}"
      SEED_HEAD_EMAIL: "${SEED_HEAD_EMAIL:-djkhalid2m@gmail.com}"
      SEED_HEAD_PASSWORD: "${SEED_HEAD_PASSWORD:-Head_183@Women&Family2026}"
      SEED_PRESIDENT_PASSWORD: "${SEED_PRESIDENT_PASSWORD:-Org_183@Women&Family2026}"
      SEED_SAMPLE_APPLICATIONS: "true"
      SEED_SAMPLE_DATA: "true"
      # Mail (defaults to log until SMTP credentials are provided in Coolify)
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-barangay183womenandfamily@gmail.com}"
      MAIL_FROM_NAME: "${APP_NAME:-Barangay 183 WFP System}"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: wfp_system
      MYSQL_USER: "${SERVICE_USER_MYSQL}"
      MYSQL_PASSWORD: "${SERVICE_PASSWORD_MYSQL}"
      MYSQL_ROOT_PASSWORD: "${SERVICE_PASSWORD_MYSQLROOT}"
      TZ: Asia/Manila
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  storage_app:
    driver: local
  storage_logs:
    driver: local
  mysql_data:
    driver: local
