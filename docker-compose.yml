services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: women-and-family-app:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=${PORT:-8000}
      - APP_NAME=${APP_NAME:-Barangay 183 WFP System}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_URL=${DB_URL:-}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-default}
      - DB_USERNAME=${DB_USERNAME:-mysql}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-public}
      - AUTORUN_MIGRATIONS=${AUTORUN_MIGRATIONS:-true}
      - AUTORUN_SEED=${AUTORUN_SEED:-false}
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs

volumes:
  storage_app:
    driver: local
  storage_logs:
    driver: local
