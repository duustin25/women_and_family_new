[program:wfp_queue_worker]
; =====================================================
; Barangay 183 WFP System — Queue Worker (Supervisor)
; Place this file at: /etc/supervisor/conf.d/wfp.conf
; Then run: supervisorctl reread && supervisorctl update
; =====================================================

; Absolute path to your artisan file on the server
command=php /var/www/html/wfp-system/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=300 --max-jobs=1000 --memory=256

; Run as your web server user
user=www-data

; Auto-start and restart
autostart=true
autorestart=true
startretries=3

; Output logs
stdout_logfile=/var/www/html/wfp-system/storage/logs/queue-worker.log
stderr_logfile=/var/www/html/wfp-system/storage/logs/queue-worker-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; Number of worker processes (1 is enough for barangay scale)
numprocs=1

; Graceful stop signal
stopwaitsecs=300
stopsignal=TERM
